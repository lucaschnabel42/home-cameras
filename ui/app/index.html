<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0d0f" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cameras" />
    <meta name="description" content="Live view and clips from the home cameras." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Cameras</title>
    <script>
      // Show this phone's theme before the first paint. The list and the key
      // are in src/lib/theme.ts; theme.test.ts fails when the two differ.
      try {
        var t = localStorage.getItem("cam.theme");
        if (/^(graphite|ocean|sand|rose)$/.test(t)) document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
