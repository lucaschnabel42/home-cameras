<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 600" width="1240" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">home-cameras architecture</title>
  <desc id="d">Cameras send video to the recorder on one computer. Wyze cameras go through the Wyze bridge. The recorder records and detects, the exporter cuts clips, and the helper sends alerts. The Caddy web server serves the app to a phone or a desktop on the home network, and to a phone away from home through Tailscale.</desc>
  <defs><marker id="a-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="a-2f6fe4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6fe4"/></marker></defs>
  <rect x="0" y="0" width="1240" height="600" rx="20" fill="#ffffff"/>
  <rect x="270" y="40" width="680" height="520" rx="18" fill="#f6f7f9" stroke="#d4d8de" stroke-width="1.5"/>
  <text x="292" y="72" font-size="14" font-weight="600" fill="#5b616b">One computer in your home (Docker)</text>

  
  <g>
    <rect x="30" y="110" width="200" height="90" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="48" y="142" font-size="17" font-weight="600" fill="#14161a">Wyze cameras</text>
    <text x="48" y="166" font-size="14" fill="#5b616b">Wi-Fi, through the</text><text x="48" y="186" font-size="14" fill="#5b616b">Wyze bridge</text>
  </g>
  
  <g>
    <rect x="30" y="290" width="200" height="90" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="48" y="322" font-size="17" font-weight="600" fill="#14161a">RTSP cameras</text>
    <text x="48" y="346" font-size="14" fill="#5b616b">Any camera with an</text><text x="48" y="366" font-size="14" fill="#5b616b">RTSP stream</text>
  </g>

  
  <g>
    <rect x="296" y="104" width="200" height="90" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="314" y="136" font-size="17" font-weight="600" fill="#14161a">wyze-bridge</text>
    <text x="314" y="160" font-size="14" fill="#5b616b">Optional. Makes an</text><text x="314" y="180" font-size="14" fill="#5b616b">RTSP stream</text>
  </g>
  
  <g>
    <rect x="540" y="190" width="220" height="130" rx="14" fill="#e8f0fd" stroke="#2f6fe4" stroke-width="1.5"/>
    <text x="558" y="222" font-size="17" font-weight="600" fill="#14161a">frigate</text>
    <text x="558" y="246" font-size="14" fill="#5b616b">Records all day</text><text x="558" y="266" font-size="14" fill="#5b616b">Finds people, animals,</text><text x="558" y="286" font-size="14" fill="#5b616b">cars; go2rtc live view</text>
  </g>
  
  <g>
    <rect x="296" y="410" width="200" height="90" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="314" y="442" font-size="17" font-weight="600" fill="#14161a">clip-exporter</text>
    <text x="314" y="466" font-size="14" fill="#5b616b">Cuts a padded clip</text><text x="314" y="486" font-size="14" fill="#5b616b">of each event</text>
  </g>
  
  <g>
    <rect x="540" y="410" width="220" height="90" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="558" y="442" font-size="17" font-weight="600" fill="#14161a">cam-helper</text>
    <text x="558" y="466" font-size="14" fill="#5b616b">Phone alerts. Optional:</text><text x="558" y="486" font-size="14" fill="#5b616b">summaries, pet day</text>
  </g>
  
  <g>
    <rect x="790" y="225" width="140" height="110" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="808" y="257" font-size="17" font-weight="600" fill="#14161a">ui</text>
    <text x="808" y="281" font-size="14" fill="#5b616b">Caddy. Serves</text><text x="808" y="301" font-size="14" fill="#5b616b">the app and an</text><text x="808" y="321" font-size="14" fill="#5b616b">API allow list</text>
  </g>

  
  <g>
    <rect x="1010" y="110" width="200" height="80" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="1028" y="142" font-size="17" font-weight="600" fill="#14161a">Phone</text>
    <text x="1028" y="166" font-size="14" fill="#5b616b">At home</text>
  </g>
  
  <g>
    <rect x="1010" y="230" width="200" height="80" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="1028" y="262" font-size="17" font-weight="600" fill="#14161a">Desktop</text>
    <text x="1028" y="286" font-size="14" fill="#5b616b">Browser at home</text>
  </g>
  
  <g>
    <rect x="1010" y="400" width="200" height="90" rx="14" fill="#ffffff" stroke="#c3c8d0" stroke-width="1.5"/>
    <text x="1028" y="432" font-size="17" font-weight="600" fill="#14161a">Phone away</text>
    <text x="1028" y="456" font-size="14" fill="#5b616b">Through your</text><text x="1028" y="476" font-size="14" fill="#5b616b">Tailscale network</text>
  </g>

